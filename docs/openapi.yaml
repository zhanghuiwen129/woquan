openapi: 3.0.3
info:
  title: woquan API
  version: v2.17.00
  description: |
    woquan 轻量级多用户朋友圈博客系统 API 规范。

    > 本文档与 `docs/API_接口手册.md` 均按 `api/routes.php`（当前 416 条路由）逐条对齐。

    ## 认证方式
    - JWT Bearer Token：登录后所有需鉴权接口需在 `Authorization` 头携带 `Bearer {token}`
    - CSRF Token：写操作(POST/PUT/DELETE)需在 `X-CSRF-Token` 头携带 CSRF 令牌；
      纯 Bearer 请求或 App / 小程序端（无认证 Cookie）由中间件自动豁免
    - Token 刷新：推荐 `/api/auth/token-refresh`（凭 refresh_token，JWT 过期 7 天后仍可续期、单次轮换）；
      `/api/auth/refresh` 仅用于未过期令牌的 Web 端无感续期（依赖有效登录态）

    ## 接口分组
    - **公开接口**：无需登录，限流保护
    - **登录接口**：需 JWT Bearer Token
    - **管理员接口**：`/api/admin/*`，需管理员角色 JWT + `AdminMiddleware`
    - **系统接口**：`/api/cron/*`、`/api/metrics`，需 `secret` / `X-Cron-Token` / `X-Metrics-Token`

    ## 响应格式
    所有接口统一返回：
    ```json
    {
      "code": 200,
      "message": "success",
      "data": { ... }
    }
    ```
    错误响应：
    ```json
    {
      "code": 400,
      "message": "错误描述",
      "data": null
    }
    ```
  contact:
    name: woquan
    url: https://gitee.com/aiwoquan/woquan
  license:
    name: MIT

servers:
  - url: /
    description: 相对路径（与前端同域）
  - url: http://127.0.0.1
    description: 本地开发

tags:
  - name: 认证
    description: 注册、登录、密码找回、第三方登录
  - name: 用户
    description: 用户资料、评论、点赞、数据导出
  - name: 动态
    description: 发布、编辑、删除、时间线、详情
  - name: 评论
    description: 评论与点赞
  - name: 收藏
    description: 收藏管理
  - name: 关注
    description: 关注、粉丝、屏蔽
  - name: 通知
    description: 消息通知与 SSE 实时推送
  - name: 即时通讯
    description: 私信、会话
  - name: 搜索
    description: 全文搜索
  - name: 站点
    description: 站点配置、统计、语言包
  - name: 定位
    description: IP 定位与逆地理编码
  - name: 举报
    description: 内容举报
  - name: 管理员
    description: 后台管理接口
  - name: CSRF
    description: CSRF 令牌
  - name: 运维
    description: 健康检查、监控指标、定时任务等系统端点
  - name: 商城
    description: 商品、订单、优惠券与积分转盘
  - name: 圈子
    description: 圈子成员、申请审核与群组管理
  - name: 实名
    description: 实名认证提交与审核
  - name: 徽章
    description: 徽章发放、冻结与日志
  - name: 活动
    description: 活动列表、报名与取消报名

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token，登录后获取
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF 令牌，写操作必需
  schemas:
    HeartbeatReportPayload:
      type: object
      description: >-
        授权统计上报请求体（POST /remote_verify.php，X-Site-Report: heartbeat）。server_ip 由服务端自行记录，客户端绝不发送。
        【签名用途边界】signature 仅作数据完整性痕迹，供服务端识别篡改与统计告警；
        它不是身份认证，服务端不得将其作为授权、配额或 entitlement 判定的输入。
        因 license_code 与 fingerprint 随包明文传输、派生 seed 随公开源码发布，该 HMAC 可被离线重算，
        只能证明数据未被中间人改动，不能证明上报方身份；防伪须依赖服务端侧证据（IP/域名白名单、速率、异常告警）。
      required: [installation_id, fingerprint, site_host, version, timestamp, nonce, signature]
      properties:
        installation_id:
          type: string
          format: uuid
          description: 安装实例主键，安装时生成并持久化，与域名/host 无关
        fingerprint:
          type: string
          description: 硬件指纹 SHA-256 摘要，辅助身份识别
        license_code:
          type: string
          description: 授权码，空串表示未提供（未授权站点）
        site_host:
          type: string
          description: 展示字段，可伪造会变化，不参与身份判定
        version:
          type: string
          description: 源码版本
        users:
          type: integer
          minimum: 0
          description: 全站启用用户数聚合计数，非个人信息
        posts:
          type: integer
          minimum: 0
          description: 全站启用动态数聚合计数，非个人信息
        timestamp:
          type: integer
          description: Unix 秒；服务端时间窗 ±1800s
        nonce:
          type: string
          description: 一次性随机串（32 位 hex），防重放
        signature:
          type: string
          description: >-
            请求签名，64 位小写 hex HMAC-SHA256。仅用于完整性校验与统计告警，
            不作为授权/配额判定依据（详见 schema description 的签名用途边界）。
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: integer
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: 参数错误
        data:
          nullable: true
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        bio:
          type: string
        role:
          type: string
          enum: [user, admin, reviewer]
        created_at:
          type: string
          format: date-time
    Post:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
          nullable: true
        title:
          type: string
          nullable: true
        content:
          type: string
        images:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: object
        videos:
          type: array
          items:
            type: object
        view_count:
          type: integer
        like_count:
          type: integer
        comment_count:
          type: integer
        is_pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

paths:
  /api/csrf:
    get:
      tags: [CSRF]
      summary: 获取 CSRF 令牌
      description: 获取用于写操作的 CSRF 令牌
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      token: { type: string }

  # ========== 认证 ==========

  /api/auth/register:
    post:
      tags: [认证]
      summary: 注册账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 20 }
                password: { type: string, minLength: 8 }
                email: { type: string, format: email }
                nickname: { type: string }
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '400':
          description: 参数错误或用户名已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/login:
    post:
      tags: [认证]
      summary: 账号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      expires_in: { type: integer, example: 604800 }
                      user: { $ref: '#/components/schemas/User' }
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/check-username:
    get:
      tags: [认证]
      summary: 检查用户名可用性
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      available: { type: boolean }

  /api/auth/check-email:
    get:
      tags: [认证]
      summary: 检查邮箱可用性
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: 检查结果

  /api/auth/send-verification:
    post:
      tags: [认证]
      summary: 发送验证邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, type]
              properties:
                email: { type: string, format: email }
                type: { type: string, enum: [register, reset] }
      responses:
        '200': { description: 发送成功 }

  /api/auth/verify-email:
    post:
      tags: [认证]
      summary: 验证邮箱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        '200': { description: 验证成功 }

  /api/auth/forgot-password:
    post:
      tags: [认证]
      summary: 找回密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: 重置链接已发送 }

  /api/auth/reset-password:
    post:
      tags: [认证]
      summary: 重置密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: 重置成功 }

  /api/auth/oauth/{provider}:
    get:
      tags: [认证]
      summary: 第三方登录跳转
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [github, google, wechat] }
      responses:
        '302': { description: 跳转到第三方授权页 }

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [认证]
      summary: 第三方登录回调
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: 登录成功 }

  /api/auth/oauth/exchange:
    post:
      tags: [认证]
      summary: 第三方凭据换取令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code]
              properties:
                provider: { type: string }
                code: { type: string }
      responses:
        '200': { description: 兑换成功 }

  /api/auth/wx-mini-login:
    post:
      tags: [认证]
      summary: 微信小程序登录
      description: wx.login → code → openid → JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: 登录成功 }

  /api/auth/me:
    get:
      tags: [认证]
      summary: 获取当前登录用户
      security: [BearerAuth: []]
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/User' }

  /api/auth/refresh:
    post:
      tags: [认证]
      summary: 刷新令牌
      security: [BearerAuth: []]
      responses:
        '200':
          description: 新 Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      token: { type: string }

  /api/auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      security: [BearerAuth: []]
      responses:
        '200': { description: 退出成功 }

  /api/auth/profile:
    put:
      tags: [认证]
      summary: 更新资料
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                bio: { type: string }
                email: { type: string, format: email }
      responses:
        '200': { description: 更新成功 }

    get:
      tags: [认证]
      summary: 获取资料
      security: [BearerAuth: []]
      responses:
        '200':
          description: 获取资料成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/auth/password:
    put:
      tags: [认证]
      summary: 修改密码
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: 修改成功 }

  /api/auth/avatar:
    post:
      tags: [认证]
      summary: 上传头像
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200': { description: 上传成功 }

  /api/auth/cover:
    post:
      tags: [认证]
      summary: 上传封面
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cover: { type: string, format: binary }
      responses:
        '200': { description: 上传成功 }

  # ========== 用户 ==========

  /api/user/profile:
    get:
      tags: [用户]
      summary: 获取用户资料
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data: { $ref: '#/components/schemas/User' }

  /api/user/search:
    get:
      tags: [用户]
      summary: 搜索用户
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: 搜索结果 }

  /api/user/comments:
    get:
      tags: [用户]
      summary: 我的评论列表
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200': { description: 评论列表 }

  /api/user/likes:
    get:
      tags: [用户]
      summary: 我的点赞列表
      parameters:
        - name: username
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200': { description: 点赞列表 }

  /api/user/export-data:
    get:
      tags: [用户]
      summary: 导出我的数据
      description: |
        导出当前登录用户的全部数据，包含账号信息、动态、评论、点赞、收藏、关注、粉丝。
        数据格式为 hublog-personal-data-v1，便于未来跨平台迁移。
      security: [BearerAuth: []]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json], default: json }
      responses:
        '200':
          description: 个人数据包
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          exported_at: { type: string, format: date-time }
                          platform: { type: string }
                          version: { type: string }
                          format: { type: string }
                      profile: { $ref: '#/components/schemas/User' }
                      posts:
                        type: array
                        items: { $ref: '#/components/schemas/Post' }
                      comments: { type: array }
                      likes: { type: array }
                      favorites: { type: array }
                      following: { type: array }
                      followers: { type: array }

  # ========== 动态 ==========

  /api/posts/timeline:
    get:
      tags: [动态]
      summary: 动态时间线
      description: |
        核心接口，使用 Deferred Join + 覆盖索引避免深分页。
        支持分类筛选、username 用户筛选、关注的人筛选与 media 媒体过滤，不提供话题筛选。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 20 }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: following
          in: query
          schema: { type: boolean }
          description: 仅看关注的人
      responses:
        '200':
          description: 时间线列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items: { $ref: '#/components/schemas/Post' }
                      pagination: { $ref: '#/components/schemas/Pagination' }

  /api/posts/detail:
    get:
      tags: [动态]
      summary: 动态详情
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 动态详情 }

  /api/posts/pinned:
    get:
      tags: [动态]
      summary: 置顶动态
      responses:
        '200': { description: 置顶列表 }

  /api/posts/topic:
    get:
      tags: [动态]
      summary: 话题动态
      description: 按话题名取动态，支持 #话题# 与 ##话题## 格式；不接收 topic_id。
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          description: 话题名称（不带 #）
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 20 }
        - name: cursor
          in: query
          schema: { type: integer }
          description: 游标，取上一页最后一条 post_id；大于 0 时启用游标分页
      responses:
        '200': { description: 话题动态 }

  /api/posts/category:
    get:
      tags: [动态]
      summary: 分类动态
      parameters:
        - name: category_id
          in: query
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200': { description: 分类动态 }

  /api/posts/latest-ids:
    get:
      tags: [动态]
      summary: 最新动态 ID
      responses:
        '200': { description: ID 列表 }

  /api/posts/check-new:
    get:
      tags: [动态]
      summary: 检查新动态
      parameters:
        - name: since_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: 新动态数量 }

  /api/posts/popular:
    get:
      tags: [动态]
