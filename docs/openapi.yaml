  /api/cron/license-heartbeat:
    post:
      tags: [运维]
      summary: 主动触发授权统计心跳上报
      security: []
      description: >
        需 `secret` 查询参数或 `X-Cron-Token` 请求头（与 /api/cron/jobs 共用 cron_secret，
        未配置时 fail-closed）。内部调用 HeartbeatReporter::reportNow()，无 token 返回 403。
        日常上报由 api/index.php 的 shutdown 钩子自动触发，本端点仅为有服务器 cron 的站点提供兜底。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
                  description: cron_secret，也可放 X-Cron-Token 头
      responses:
        '200':
          description: 触发成功（reported=false 表示本次未实际发送，通常因未到期或失败静默）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  data:
                    type: object
                    properties:
                      reported: { type: boolean }
        '403':
          description: cron token 无效或未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

