        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 上传成功 }

  /api/posts/upload-video:
    post:
      tags: [动态]
      summary: 上传视频动态
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 上传成功 }

