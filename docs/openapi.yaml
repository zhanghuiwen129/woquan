      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '200': { description: 删除成功 }

  /api/upload/sign:
    post:
      tags: [动态]
      summary: 直传签名
      description: |
        第一步，获取直传签名。type 支持 avatar / cover / image / video / attachment；
        按类型大小上限：avatar 20MB、cover / image 50MB、video / attachment 500MB。
        content_length 必须大于 0，超限返回 400。
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, filename, content_length]
              properties:
                type: { type: string, enum: [avatar, cover, image, video, attachment] }
                filename: { type: string }
                content_length: { type: integer, minimum: 1 }
                content_type: { type: string }
      responses:
        '200': { description: 签名信息 }

  /api/upload/register:
    post:
      tags: [动态]
      summary: 直传注册
      description: 第二步，前端直传完成后回传 object_key 与 final_url 入库；按 type 返回对应媒体对象
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, object_key, final_url]
              properties:
                type: { type: string, enum: [avatar, cover, image, video, attachment] }
                object_key: { type: string }
                final_url: { type: string }
                file_size: { type: integer }
                orig_filename: { type: string }
                mime_type: { type: string }
      responses:
        '200': { description: 登记成功 }

