      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: content、images/videos/attachments 媒体或帖型内容至少提供其一；content 可为空（有媒体或帖型时）
              properties:
                content: { type: string, nullable: true }
                title: { type: string }
                category_id: { type: integer }
                images: { type: array, items: { type: string } }
                videos: { type: array, items: { type: string } }
                attachments: { type: array, items: { type: object } }
                mentions: { type: array, items: { type: integer } }
                is_anonymous: { type: boolean }
                location: { type: object }
      responses:
        '200': { description: 发布成功 }
    put:
      tags: [动态]
      summary: 编辑动态
      security: [BearerAuth: [], CsrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
                content: { type: string }
                title: { type: string }
                images: { type: array, items: { type: string } }
      responses:
        '200': { description: 编辑成功 }
    delete:
      tags: [动态]
      summary: 删除动态
      security: [BearerAuth: [], CsrfToken: []]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 删除成功 }

