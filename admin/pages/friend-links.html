        <div id="page-friend-links" class="hidden">
            <div class="card">
                <div class="card-head">
                    <h3>友情链接列表</h3>
                    <button class="btn btn-primary" data-action="open-friend-link-form"><i data-icon="plus"></i>添加友情链接</button>
                </div>
                <table>
                    <thead><tr><th>排序</th><th>网站名称</th><th>网址</th><th>描述</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="friend-links-table"></tbody>
                </table>
                <div id="friend-link-form" class="hidden" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                    <h3 style="font-size:16px;margin-bottom:16px;" id="friend-link-form-title">添加友情链接</h3>
                    <input type="hidden" id="friend-link-id">
                    <div class="form-group">
                        <label>网站名称</label>
                        <input type="text" class="form-input" id="friend-link-name" placeholder="例如：我圈">
                    </div>
                    <div class="form-group">
                        <label>网址</label>
                        <input type="text" class="form-input" id="friend-link-url" placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <input type="text" class="form-input" id="friend-link-description" placeholder="简短描述，可选">
                    </div>
                    <div class="form-group">
                        <label>排序值（数字越小越靠前）</label>
                        <input type="number" class="form-input" id="friend-link-sort-order" value="0">
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" id="friend-link-status" checked> 启用</label>
                    </div>
                    <div style="display:flex;gap:12px;">
                        <button class="btn btn-primary" data-action="save-friend-link">保存</button>
                        <button class="btn btn-default" data-action="close-friend-link-form">取消</button>
                    </div>
                </div>
            </div>
        </div>
