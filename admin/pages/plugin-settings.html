<div id="page-plugin-settings" class="hidden">
    <div class="card">
        <div class="card-head">
            <h3><i data-icon="settings"></i>插件设置</h3>
            <div class="card-head-actions">
                <select id="plugin-settings-picker" class="form-input" style="min-width:220px;" data-change="plugin-settings-select" aria-label="选择插件"></select>
            </div>
        </div>
        <div style="padding:16px;">
            <div id="plugin-settings-notice" style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">选择已声明后台设置的插件以载入其设置页。</div>
            <div id="plugin-settings-host" style="border:1px solid var(--border);border-radius:10px;padding:16px;min-height:180px;"></div>
            <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
                <button class="btn btn-primary" type="button" data-action="plugin-settings-save">保存配置</button>
                <span id="plugin-settings-status" style="font-size:12px;color:var(--text-muted);"></span>
            </div>
        </div>
    </div>
</div>
