        <div id="page-pages" class="hidden">
            <div class="card">
                <div class="card-head">
                    <h3>单页管理</h3>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary" data-action="open-page-form"><i data-icon="plus"></i>新建单页</button>
                        <button class="btn btn-default" data-action="reload-pages"><i data-icon="refresh"></i>刷新</button>
                    </div>
                </div>
                <p style="color:var(--text-muted);font-size:13px;margin:0 0 12px;">
                    发布后的单页可通过 <code>/api/pages/{slug}</code> 公开读取；三类协议页请使用
                    <code>agreement_user</code> / <code>agreement_privacy</code> / <code>agreement_realname</code> 标识，
                    发布后即覆盖 App 端协议正文。
                </p>
                <table>
                    <thead>
                        <tr><th>slug</th><th>标题</th><th>状态</th><th>来源</th><th>更新时间</th><th>操作</th></tr>
                    </thead>
                    <tbody id="pages-table"></tbody>
                </table>

                <div id="pages-form" class="hidden" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                    <h3 style="font-size:16px;margin-bottom:16px;" id="pages-form-title">新建单页</h3>
                    <input type="hidden" id="pages-id">
                    <div class="form-group">
                        <label>slug（小写字母、数字、连字符；发布后建议不要修改）</label>
                        <input type="text" class="form-input" id="pages-slug" placeholder="例如：about / help / agreement_user">
                    </div>
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" class="form-input" id="pages-title" placeholder="例如：关于我们">
                    </div>
                    <div class="form-group">
                        <label>正文（支持 Markdown）</label>
                        <div id="pages-vditor"></div>
                        <textarea class="form-input hidden" id="pages-content" rows="12" placeholder="Vditor 未加载时可在此输入正文"></textarea>
                    </div>
                    <div class="form-group">
                        <label>SEO 标题</label>
                        <input type="text" class="form-input" id="pages-seo-title">
                    </div>
                    <div class="form-group">
                        <label>SEO 描述</label>
                        <input type="text" class="form-input" id="pages-seo-description">
                    </div>
                    <div class="form-group">
                        <label>SEO 关键词</label>
                        <input type="text" class="form-input" id="pages-seo-keywords">
                    </div>
                    <div class="form-group">
                        <label>排序值（数字越小越靠前）</label>
                        <input type="number" class="form-input" id="pages-sort-order" value="0">
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" id="pages-status"> 已发布（未勾选为草稿，公开接口返回 404）</label>
                    </div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <button class="btn btn-primary" data-action="save-page">保存</button>
                        <button class="btn btn-default" data-action="preview-page">预览正文</button>
                        <button class="btn btn-default" data-action="close-page-form">取消</button>
                    </div>
                </div>

                <div id="pages-preview" class="hidden" style="margin-top:20px;padding:16px;border:1px solid var(--border);border-radius:6px;">
                    <h3 id="pages-preview-title" style="font-size:16px;margin-bottom:12px;">正文预览</h3>
                    <div id="pages-preview-body" style="max-height:420px;overflow:auto;line-height:1.7;"></div>
                    <button class="btn btn-default" data-action="close-page-preview" style="margin-top:12px;">关闭预览</button>
                </div>
            </div>
        </div>
