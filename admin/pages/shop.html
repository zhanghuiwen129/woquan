        <div id="page-shop" class="hidden">
            <div class="card">
                <div class="card-head">
                    <h3><i data-icon="shopping-bag"></i>积分商城</h3>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary" data-action="open-shop-product-form" data-value="coupon">+ 上架会员折扣卡</button>
                        <button class="btn btn-default" data-action="open-shop-product-form" data-value="vip">+ 折扣会员</button>
                        <button class="btn btn-default" data-action="open-shop-product-form" data-value="physical">+ 圈子周边</button>
                    </div>
                </div>

                <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                    <button class="btn btn-default" id="shop-tab-products" data-action="shop-tab" data-value="products">商品管理</button>
                    <button class="btn btn-default" id="shop-tab-orders" data-action="shop-tab" data-value="orders">商城订单</button>
                    <button class="btn btn-default" id="shop-tab-coupons" data-action="shop-tab" data-value="coupons">折扣卡记录</button>
                </div>

                <!-- ============ 商品管理 ============ -->
                <div id="shop-pane-products">
                    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
                        <select id="shop-filter-type" class="form-input" style="max-width:170px;" data-change="load-shop-products">
                            <option value="">全部类型</option>
                            <option value="vip">折扣会员</option>
                            <option value="coupon">会员折扣卡</option>
                            <option value="physical">圈子周边</option>
                            <option value="info">圈友好物</option>
                        </select>
                        <select id="shop-filter-status" class="form-input" style="max-width:140px;" data-change="load-shop-products">
                            <option value="">全部状态</option>
                            <option value="1">已上架</option>
                            <option value="0">已下架</option>
                        </select>
                        <input id="shop-keyword" class="form-input" placeholder="搜索商品标题" style="max-width:220px;" data-input="load-shop-products">
                    </div>
                    <table>
                        <thead><tr><th>类型</th><th>标题</th><th>售价</th><th>配置</th><th>库存/销量</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="shop-products-table"></tbody>
                    </table>

                    <div id="shop-product-form" class="hidden" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                        <h3 style="font-size:16px;margin-bottom:16px;" id="shop-product-form-title"><i data-icon="shopping-bag"></i>上架商品</h3>
                        <input type="hidden" id="shop-p-id">
                        <div class="form-group">
                            <label>商品类型</label>
                            <select id="shop-p-type" class="form-input" data-change="sync-shop-product-type">
                                <option value="coupon">会员折扣卡（买了发券，买会员时抵扣）</option>
                                <option value="vip">折扣会员（买了直接发会员）</option>
                                <option value="physical">圈子周边（实物，需发货）</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>商品标题</label>
                            <input type="text" class="form-input" id="shop-p-title" placeholder="例如：黄金会员 8 折卡">
                        </div>
                        <div class="form-group">
                            <label>封面图 URL</label>
                            <input type="text" class="form-input" id="shop-p-cover" placeholder="https://...（可留空，用默认图标）">
                        </div>
                        <div class="form-group">
                            <label>介绍</label>
                            <input type="text" class="form-input" id="shop-p-content" placeholder="一句话说明（可选）">
                        </div>
                        <div style="display:flex;gap:12px;flex-wrap:wrap;">
                            <div class="form-group" style="flex:1;min-width:180px;">
                                <label>余额售价（元）</label>
                                <input type="number" class="form-input" id="shop-p-price-balance" min="0" step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group" style="flex:1;min-width:180px;">
                                <label>积分售价</label>
                                <input type="number" class="form-input" id="shop-p-price-points" min="0" step="1" placeholder="0">
                            </div>
                        </div>

                        <!-- 折扣会员专属 -->
                        <div id="shop-block-vip" class="hidden" style="display:flex;gap:12px;flex-wrap:wrap;">
                            <div class="form-group" style="flex:1;min-width:180px;">
                                <label>会员档位</label>
                                <select id="shop-p-vip-level" class="form-input">
                                    <option value="1">青铜（1）</option>
                                    <option value="2">白银（2）</option>
                                    <option value="3">黄金（3）</option>
                                </select>
                            </div>
                            <div class="form-group" style="flex:1;min-width:180px;">
                                <label>有效期（天）</label>
                                <input type="number" class="form-input" id="shop-p-vip-days" min="1" step="1" placeholder="30">
                            </div>
                        </div>

                        <!-- 会员折扣卡专属（V143） -->
                        <div id="shop-block-coupon" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;">
                            <div style="font-weight:600;margin-bottom:10px;">折扣规则</div>
                            <div class="form-group">
                                <label>折扣方式</label>
                                <select id="shop-p-discount-mode" class="form-input" data-change="sync-shop-product-type">
                                    <option value="percent">按比例打折</option>
                                    <option value="amount">固定金额立减</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label id="shop-p-discount-label">减免百分比（填 20 = 减 20%，即 8 折）</label>
                                <input type="number" class="form-input" id="shop-p-discount-value" min="0.01" step="0.01" placeholder="20" data-input="sync-shop-product-type">
                            </div>
                            <div class="form-group">
                                <label>适用会员档位（不勾 = 三档通用）</label>
                                <div style="display:flex;gap:16px;flex-wrap:wrap;">
                                    <label><input type="checkbox" id="shop-p-level-1" data-change="sync-shop-product-type"> 青铜</label>
                                    <label><input type="checkbox" id="shop-p-level-2" data-change="sync-shop-product-type"> 白银</label>
                                    <label><input type="checkbox" id="shop-p-level-3" data-change="sync-shop-product-type"> 黄金</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>有效天数（购买后 N 天内必须用掉；0 = 长期有效）</label>
                                <input type="number" class="form-input" id="shop-p-valid-days" min="0" step="1" value="0">
                            </div>
                            <div style="font-size:12px;color:var(--text-secondary,#888);" id="shop-p-discount-preview"></div>
                        </div>

                        <div style="display:flex;gap:12px;flex-wrap:wrap;">
                            <div class="form-group" style="flex:1;min-width:160px;">
                                <label>库存（0 = 不限）</label>
                                <input type="number" class="form-input" id="shop-p-stock" min="0" step="1" value="0">
                            </div>
                            <div class="form-group" style="flex:1;min-width:160px;">
                                <label>排序（越小越靠前）</label>
                                <input type="number" class="form-input" id="shop-p-sort" min="0" step="1" value="0">
                            </div>
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox" id="shop-p-status" checked> 立即上架</label>
                        </div>
                        <div style="display:flex;gap:12px;">
                            <button class="btn btn-primary" data-action="save-shop-product">保存</button>
                            <button class="btn btn-default" data-action="close-shop-product-form">取消</button>
                        </div>
                    </div>
                </div>

                <!-- ============ 商城订单 ============ -->
                <div id="shop-pane-orders" class="hidden">
                    <table>
                        <thead><tr><th>订单号</th><th>买家</th><th>商品</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="shop-orders-table"></tbody>
                    </table>
                </div>

                <!-- ============ 折扣卡发放记录 ============ -->
                <div id="shop-pane-coupons" class="hidden">
                    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
                        <select id="shop-coupon-status" class="form-input" style="max-width:160px;" data-change="load-shop-coupons">
                            <option value="">全部状态</option>
                            <option value="unused">未使用</option>
                            <option value="used">已使用</option>
                            <option value="expired">已过期</option>
                        </select>
                        <input id="shop-coupon-keyword" class="form-input" placeholder="搜索券名 / 用户" style="max-width:220px;" data-input="load-shop-coupons">
                    </div>
                    <table>
                        <thead><tr><th>用户</th><th>折扣卡</th><th>折扣</th><th>状态</th><th>有效期</th><th>核销订单</th></tr></thead>
                        <tbody id="shop-coupons-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
