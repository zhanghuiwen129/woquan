        <div id="page-categories" class="hidden">
            <div class="card">
                <div class="card-head">
                    <h3>分类列表</h3>
                    <button class="btn btn-primary" data-action="open-category-form"><i data-icon="plus"></i>添加分类</button>
                </div>
                <table>
                    <thead><tr><th>排序</th><th>分类名称</th><th>层级</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="categories-table"></tbody>
                </table>
                <div id="category-form" class="hidden" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                    <h3 style="font-size:16px;margin-bottom:16px;" id="category-form-title">添加分类</h3>
                    <input type="hidden" id="category-id">
                    <div class="form-group">
                        <label>分类名称</label>
                        <input type="text" class="form-input" id="category-name" placeholder="例如：技术分享">
                    </div>
                    <div class="form-group">
                        <label>父分类（留空为一级分类）</label>
                        <select class="form-input" id="category-parent_id">
                            <option value="">无（一级分类）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>排序值（数字越小越靠前）</label>
                        <input type="number" class="form-input" id="category-sort_order" value="0">
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" id="category-status" checked> 启用</label>
                    </div>
                    <div style="display:flex;gap:12px;">
                        <button class="btn btn-primary" data-action="save-category">保存</button>
                        <button class="btn btn-default" data-action="close-category-form">取消</button>
                    </div>
                </div>
            </div>
        </div>
