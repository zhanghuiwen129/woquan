        <div id="page-export" class="hidden">
            <div class="card">
                <div class="card-head"><h3><i data-icon="download"></i>数据导出</h3></div>
                <div class="notice">
                    <i data-icon="info"></i>
                    <div>选择要导出的数据类型和格式，点击导出按钮即可下载文件。<strong>JSON</strong> 适合备份迁移，<strong>CSV</strong> 适合在 Excel 中查看。</div>
                </div>
                <div class="form-grid2">
                    <div class="form-group">
                        <label>导出类型</label>
                        <select class="form-input" id="export-type">
                            <option value="users">用户数据</option>
                            <option value="posts">动态数据</option>
                            <option value="comments">评论数据</option>
                            <option value="all">全部数据</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>导出格式</label>
                        <select class="form-input" id="export-format">
                            <option value="json">JSON</option>
                            <option value="csv">CSV</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" data-action="do-export"><i data-icon="download"></i>导出数据</button>
            </div>
        </div>
