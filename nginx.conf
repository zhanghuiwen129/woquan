# Hublog Nginx 伪静态 & 安全配置
# ─────────────────────────────────────────────────────────────────────
# 【宝塔用户】只把下方「伪静态区」整段复制到 宝塔 → 网站 → 伪静态 保存。
#   注意两条铁律（违反即报 nginx -t failed）：
#   1. 不要粘贴 autoindex —— 宝塔 server 块自带，重复报
#      "autoindex directive is duplicate"；
#   2. 不要粘贴 location ~ \.php —— 与宝塔自带 PHP include 重复报
#      "duplicate location"，且宝塔 PHP 监听并非 127.0.0.1:9000。
#      PATH_INFO（/api/index.php/xxx 形式）宝塔自带 PHP 块已支持。
#   另：伪静态目录（如 D:\BtSoft\nginx\conf\rewrite\default.com\）里若有
#   此前手工写入的旧规则 .conf，必须删除或清空，否则 location 重复同样报错。
#
# 【独立 nginx 用户】全文复制进站点 server {} 块，取消文件末尾 PHP 块注释
#   并按实际环境修改 fastcgi_pass（unix sock 或 TCP 端口）。
# ─────────────────────────────────────────────────────────────────────

# ========== 伪静态区（宝塔粘贴：从这一行开始） ==========

# ── 服务器级参数（与 .htaccess / Caddyfile / web.config 对齐）──
# 上传体积上限 100M（对齐 .htaccess php_value upload_max_filesize/post_max_size、
# Caddyfile request_body max_size、web.config maxRequestLength=104857600）
# 说明：宝塔主 nginx.conf 的 http{} 块自带 client_max_body_size 50m，
#       此处是 server{} 级覆盖（子级覆盖父级，不会触发 "directive is duplicate"）
client_max_body_size 100m;

# gzip 压缩（对齐 .htaccess mod_deflate / Caddyfile encode gzip zstd）
# 说明：宝塔 http{} 块已带 gzip，此处同为 server{} 级覆盖，gzip_types 取并集
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/xml+rss image/svg+xml;

# 全局安全响应头（对齐 Caddyfile 顶部 header 块）
# 注意：nginx 的 add_header 只在「当前层级没有 add_header」时才继承父级，
#       /admin/ 等自带 add_header 的 location 仍以自身头部为准（原设计不动）
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 全局 CSP：object-src / frame-ancestors 收紧；
# script-src 保留 'unsafe-inline'、img-src 放行 jsdelivr CDN ——
# 前台主题模板仍在用内联 <script> 与 onclick 属性、表情图取自 cdn.jsdelivr.net，
# 若收紧成纯 'self' 会让生产环境整站前端脚本与表情图直接失效
add_header Content-Security-Policy   "default-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

# 敏感文件：404（压缩包 / 配置 / 日志 / 数据库）
location ~* \.(zip|rar|7z|tar|gz|tgz|bz2|xz|lz|iso)$ {
    deny all;
    return 404;
}
location ~* \.(md|yml|yaml|env|phar|lock|log|sql|bak|backup|ini|conf)$ {
    deny all;
    return 404;
}

# 敏感目录 / 隐藏文件：404
location ~* ^/(backups|cache|logs|sql|docs)(/|$) {
    deny all;
    return 404;
}
location ~* ^/license_system/data(/|$) {
    deny all;
    return 404;
}
location ~* ^/license_system/.*\.(json|log|bak|lock|sqlite|sqlite3|db)$ {
    deny all;
    return 404;
}
location ~ /\. {
    deny all;
    return 404;
}

# 安装/修复脚本与锁文件（装完必须封死）
location ~ ^/(config|install|fix_admin_id|fix_db|fix_migration|security-check|composer\.(json|lock))\.php$|/install\.lock|/\.installed\.lock|\.env(\.|$) {
    deny all;
    return 404;
}

# uploads / plugins 安全：先封 PHP 再放行附件（正则 location 按书写顺序命中，顺序不能反）
location ~* ^/uploads/.*\.php\d*(/|$) {
    deny all;
    return 404;
}
location ~* ^/plugins/.*\.php\d*(/|$) {
    deny all;
    return 404;
}
location ~* ^/uploads/attachments/ {
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    default_type application/octet-stream;
    try_files $uri =404;
}

# 后台静态资源 no-cache：防新旧 JS 混搭导致菜单点击后页面空白
# （必须位于宝塔自带 js/css 缓存规则之前生效，伪静态区 include 顺序天然在前）
location ~* ^/admin/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; base-uri 'self'; script-src 'self'";
}

# 前台静态资源长期缓存（对齐 Caddyfile @static 30 天 / .htaccess ExpiresByType 1 年）
# 必须位于上方 /admin/ 资源规则之后：正则 location 按书写顺序命中，admin 的 no-cache 优先
location ~* \.(css|js|mjs|cjs|png|jpe?g|gif|bmp|ico|svg|webp|woff2?|ttf|eot|otf)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# 健康检查 /health：注册在 api/routes.php 顶层（不在 /api 组内），
# 若落到前台入口 index.php 会被主题页分支排除（health 在保留字里），返回的是首页 HTML 而不是 JSON，
# 这里显式转交 API 入口；$request_uri 不变，api/index.php 仍按 /health 派发
location = /health {
    try_files /api/index.php =404;
}

# 路由转发
location /api/ {
    index index.php;
    try_files $uri $uri/ /api/index.php?$query_string;
}
location /admin/ {
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; base-uri 'self'; script-src 'self'";
}
location / {
    index index.php;
    try_files $uri $uri/ /index.php?$query_string;
}

# ========== 伪静态区（宝塔粘贴：到这一行结束） ==========

