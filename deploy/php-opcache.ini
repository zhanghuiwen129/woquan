; ============================================================================
; Hublog · OPcache 推荐配置（PHP 8.1 + PHP-FPM + Nginx）
; ----------------------------------------------------------------------------
; 【为什么需要这个文件】
; 本仓诊断结论：「全仓零配置；每请求编译 ~340KB，稳态 QPS 上限被压低」。
; 仓库里没有任何 php.ini / OPcache 配置产物，服务器侧是否开启完全取决于
; 装机时随手选的默认值 —— PHP 官方镜像里 opcache 扩展虽然预装，但
; opcache.enable 默认是 0（即「装了但没开」），这正是「零配置」的真实含义。
;
; 本文件是可直接落地的配置产物：贴进 php.ini 即生效，不需要改一行代码。
;
; 【怎么用】
; ① 宝塔面板（推荐）：
;    软件商店 → PHP 8.1 → 设置 → 配置修改 → 找到已有的 [opcache] 段，
;    把本文件里「除注释外」的有效行【替换】进去（同名键改值，不要并存两份），
;    保存 → 重启 PHP（面板上的「重载配置」或「重启」）。
;    也可以在「设置 → 性能设置」里直接勾选「开启 OPcache」，但面板生成的
;    参数是通用默认值，不含本仓的 max_accelerated_files / JIT 决策。
;
; ② 裸服务器 / Docker：
;    独立成文件最省心（PHP 会自动扫描 conf.d 下的 *.ini，且不与 php.ini
;    里已有的 [opcache] 段产生「同名键谁生效」的歧义）：
;      cp deploy/php-opcache.ini /etc/php/8.1/fpm/conf.d/99-hublog-opcache.ini
;      systemctl restart php-fpm        # 或 /etc/init.d/php-fpm restart
;    或者直接编辑 php.ini 的 [opcache] 段，改完同样要完整重启 PHP-FPM：
;      systemctl restart php-fpm
;    （本文件不带 [opcache] 段头：整份丢进 conf.d 就能用；手工粘贴时只复制
;      有效行进 php.ini 已有的 [opcache] 段即可。）
;    ⚠ 只 reload 不够：opcache.* 里有一部分是 PHP_INI_SYSTEM（见下方标注），
;      改了必须完整重启 PHP-FPM 进程才能生效。
;
; ③ 容器镜像：
;    把本文件 COPY 进镜像的 /usr/local/etc/php/conf.d/ 目录（PHP 会自动
;    扫描 *.ini），比直接改 php.ini 更干净，升级基础镜像时也不会冲突。
;
; 【同名键的处理】
;   php.ini 里如果已经有 opcache.xxx，用【改值】而不是【再追加一行】：
;   同名键在 ini 里出现两次时，PHP 取哪一个取决于版本与段落位置
;   （实测：干净 ini 里是后者覆盖前者，但把整段贴到别的段落下可能不生效），
;   谁生效并不直观 —— 唯一可靠的做法是让每个键只出现一次，然后核对生效值。
;
; 【怎么验证】
;   php -i | grep -i opcache              # 看最终生效值（逐个键核对）
;   php -r 'var_dump(opcache_get_status());'  # 看缓存脚本数与命中率
;   php scripts/check-runtime.php         # 本仓自带的只读体检脚本（退出码分级）
;
;   注意：opcache.enable_cli 默认关闭，所以直接跑 php scripts/check-runtime.php
;   只能读到「配置值」，读不到「运行时缓存命中率」。要采集命中率请用：
;   php -d opcache.enable_cli=1 scripts/check-runtime.php
;
; 【改动前先记住这三个数字】
;   改动前：php -i | grep -E 'opcache.(enable|memory_consumption|max_accelerated_files)'
;   改动后：同样命令再跑一次，两次输出留档，便于回滚与效果对比。
; ============================================================================


; ----------------------------------------------------------------------------
; ① 总开关：必须为 1
; ----------------------------------------------------------------------------
; 为什么：PHP 官方发行版默认 opcache.enable=0 —— 扩展在、缓存没开，
; 每个请求都重新编译全部 PHP 文件（本仓约 340KB 源码），CPU 全花在编译上。
; 改成：把「编译」结果留在共享内存里复用，请求直接跑 opcode。
; 改了会怎样：设为 0 = 等于没开（当前状态）；设为 1 后稳态 QPS 通常有
; 明显提升，且响应时间里的「编译」占比消失。
opcache.enable=1


; ----------------------------------------------------------------------------
; ② CLI 是否启用：默认关闭（保持 0）
; ----------------------------------------------------------------------------
; 为什么：线上流量走 PHP-FPM，CLI 只用于巡检脚本和一次性任务，
; 给 CLI 开缓存会额外占用共享内存，收益接近 0。
; 改了会怎样：设 1 → CLI 也会缓存文件；本仓的 scripts/check-runtime.php
; 就必须加 -d opcache.enable_cli=1 才能读到运行时缓存命中率（配置值照样能读）。
; ⚠ 若你的机器是用 CLI 跑常驻 worker（而不是 HTTP cron），这里应改成 1。
opcache.enable_cli=0


; ----------------------------------------------------------------------------
; ③ 共享内存占用上限（MB）：128 → 192
; ----------------------------------------------------------------------------
; 为什么改成 192：共享内存里放的是「编译后的脚本 + 元数据」，
; 大约等于 缓存脚本数 × 单文件平均编译体积。本仓应用代码约 192 个 PHP 文件
; （api 174 + plugins 5 + templates 1 + scripts 6 + bin 1 + 根目录 5），
; 源码合计约 340KB —— 128MB（PHP 默认）已经远够用，这里调到 192 纯粹是
; 给「未来引入运行时 vendor 依赖 / 模板编译产物」留余量，避免缓存写满后
; 静默退化成「部分文件不缓存」。
; 改了会怎样：调小 → 缓存写满后新脚本进不去（不报错，只是静默不缓存）；
; 调大 → 多占服务器物理内存（不是每个进程各占一份，是 FPM 进程组共享）。
; 调整后必须重启 PHP-FPM。
opcache.memory_consumption=192


; ----------------------------------------------------------------------------
; ④ 最多缓存多少个脚本：10000 → 20000
; ----------------------------------------------------------------------------
; 为什么：这是一个固定大小的哈希表，装满之后新脚本「进不去缓存」，
; PHP 不会报错，只是持续重新编译 —— 运维往往察觉不到，只会感觉「开了也没用」。
; 本仓应用代码 192 个文件，加上未来可能出现的运行时 vendor 依赖，
; 20000 相当于 ~100 倍余量，代价只是几百 KB 共享内存。
; 改了会怎样：设成比实际文件数小 → 后面的文件永远进不了缓存（等于半开）；
; 设大 → 无副作用，只是多占一点共享内存。
; 查看当前实际文件数：find . -name '*.php' -not -path './vendor/*' | wc -l
opcache.max_accelerated_files=20000


; ----------------------------------------------------------------------------
; ⑤ 时间戳校验：保持 1（开发/热更新友好）
; ----------------------------------------------------------------------------
; 为什么不改 0：opcache.validate_timestamps=0 是「生产极速模式」，
; 代价是改代码后不重启 PHP-FPM 就永远跑旧代码。本仓的发布方式是
; 「拷贝文件到站点目录」而不是「重启进程」，一旦开了 0 就会出现
; 「代码改了但线上行为没变」这类极难排查的问题。
; opcache.revalidate_freq=2 的含义是：文件修改时间最多每 2 秒才复查一次，
; 摊薄后每次请求平均只有 1 次 stat，CPU 开销可以忽略；
; 换来的收益是「改完文件 2 秒内生效」，不用重启、不用清缓存。
; 改了会怎样：
;   - validate_timestamps=0：省掉 stat，但改代码必须重启 PHP-FPM 才生效；
;   - revalidate_freq 调大（如 60）：stat 更省，但发布后生效延迟变成 60 秒。
; ⚠ 如果你的发布流程「每次发布都会重启 PHP-FPM」，可以把这两项改成
;   validate_timestamps=0 / revalidate_freq=0 换极致性能（改后必须重启）。
opcache.validate_timestamps=1
opcache.revalidate_freq=2


; ----------------------------------------------------------------------------
; ⑥ 是否保留代码注释：保持 1
; ----------------------------------------------------------------------------
; 为什么：PHP 的注解式反射（读注释里的元信息）在本仓多处被使用，
; 注释被剥离后这类解析会拿到空值；同时 PHPUnit 读取测试方法的
; @dataProvider / @depends 注释也需要它。
; 改了会怎样：设为 0 → 注释不进入缓存，依赖注释的反射逻辑失效，
; 性能收益只有百分之几，不值得。
opcache.save_comments=1


; ----------------------------------------------------------------------------
; ⑦ JIT：默认关闭（jit=disable + jit_buffer_size=0）
; ----------------------------------------------------------------------------
; 为什么：JIT 只对「纯 CPU 密集的数值循环」有收益。本仓是典型的
; IO 密集型（MySQL 查询 + 文件 IO + JSON 编解码），热路径里没有值得 JIT 的
; 紧循环，开了基本是白开；反而要额外吃 64MB 共享内存，且历史上 JIT
; 存在少量导致「代码行为异常」的 bug。
; 注意：PHP 的默认值是 opcache.jit=tracing，但 opcache.jit_buffer_size=0
; —— 也就是说「JIT 类型选了 tracing，但缓冲区是 0，等于没开」。
; 这里显式写 jit=disable，把「不开」这件事从「默认值巧合」变成「显式决策」。
; 改了会怎样：想要 JIT 就把下面两行的注释去掉并设 jit_buffer_size=64M，
; 然后必须重启 PHP-FPM 并实测压测对比（很多站点开了 JIT 反而更慢）。
opcache.jit=disable
opcache.jit_buffer_size=0


; ----------------------------------------------------------------------------
; ⑧ 内部字符串驻留缓冲（KB）：8 → 16
; ----------------------------------------------------------------------------
; 为什么：PHP 把所有字符串字面量放进这块共享内存，重复出现的类名/方法名/
; SQL 片段可以复用。本仓类名与方法名很长、重复率高，16MB 足够。
; 改了会怎样：太小 → 内部字符串放不下，会在运行时动态分配并释放，
; 反而更慢；这个值太小不会有任何报错提示。
opcache.interned_strings_buffer=16


; ----------------------------------------------------------------------------
; ⑨ 缓存浪费回收阈值（%）：保持 5
; ----------------------------------------------------------------------------
; 为什么：当 OPcache 内存占用超过上限的 5% 时，OPcache 会启动回收，
; 清理掉不再被使用的缓存条目。5% 是 PHP 默认值，是个平衡点：
; 太小 → 回收太频繁（抖动）；太大 → 内存长期占着不释放。
; 改了会怎样：这是应急阀门，正常不用动。
opcache.max_wasted_percentage=5


; ----------------------------------------------------------------------------
; ⑩ 磁盘二级缓存（file_cache）：默认关闭，按需开启
; ----------------------------------------------------------------------------
; 为什么：开启后，即便 OPcache 共享内存被清空（例如重启 PHP-FPM），
; 编译结果仍能从磁盘缓存直接恢复 —— 冷启动不再「整站重新编译」。
; 本仓默认不开，是因为需要一块可写目录，容器 / 只读文件系统上会直接启动失败。
; 改了会怎样：取消下面两行的注释，并把目录改成服务器上真实存在、可写的路径
; （PHP-FPM 用户 www/www-data 需要写权限），然后重启 PHP-FPM。
; ⚠ file_cache_only=1 时会「只用磁盘缓存、完全不用内存缓存」，
;   本仓不要这么设（内存缓存才是快的那个）。
;opcache.file_cache=/tmp/opcache
;opcache.file_cache_only=0


; ----------------------------------------------------------------------------
; ⑪ 其他：保持默认，不要动
; ----------------------------------------------------------------------------
; opcache.use_cwd=1：同名的 include_relative 路径在不同工作目录下解析不同，
;   保持默认开启，避免「同一文件被当成两个文件缓存」。
; opcache.huge_code_pages=1：需要 root 且系统预留了大页，收益有限，不开。
; opcache.save_comments 已在 ⑥ 处理。
; opcache.optimization_level：默认 0x7FF 是全量优化，保持默认。
