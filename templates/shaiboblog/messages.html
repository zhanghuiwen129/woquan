<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<meta name="keywords" content="{{PAGE_KEYWORDS}}">
<title>{{PAGE_TITLE}}</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261128.03">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<script>
window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/';
window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
</script>
</head>
<body class="page-messages">
<h1 class="sr-only">消息中心</h1>

<!-- @include partials/topbar.html -->

<main class="page-main">
  <section class="page-head compact-head">
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="{{PAGE_BASE}}/" data-home>首页</a><span>/</span><span>消息</span>
    </nav>
    <span class="page-kicker">// NOTIFICATIONS</span>
    <div class="page-head-main">
      <div class="page-head-copy">
        <h1>消息中心</h1>
        <p>评论、点赞、关注与系统通知都在这里。</p>
      </div>
      <div class="page-head-actions">
        <button class="btn-ghost" id="readAllBtn" type="button">全部已读</button>
      </div>
    </div>
  </section>

  <div class="notice-wrap">
    <nav class="tabs" id="noticeTabs">
      <button class="tab active" data-tab="comment" type="button">评论<span class="badge" id="badge-comment" style="display:none">0</span></button>
      <button class="tab" data-tab="like" type="button">点赞<span class="badge" id="badge-like" style="display:none">0</span></button>
      <button class="tab" data-tab="follow" type="button">关注<span class="badge" id="badge-follow" style="display:none">0</span></button>
      <button class="tab" data-tab="channel" type="button">频道<span class="badge" id="badge-channel" style="display:none">0</span></button>
      <button class="tab" data-tab="system" type="button">系统<span class="badge" id="badge-system" style="display:none">0</span></button>
    </nav>
    <div id="noticeList"></div>
    <div class="load-more" id="load-more" style="display:none">加载更多</div>
  </div>
</main>

<!-- @include partials/footer.html -->

<!-- @include partials/tabbar.html -->

<!-- @include partials/page-tail.html -->

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
