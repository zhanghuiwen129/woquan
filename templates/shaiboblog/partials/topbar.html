<header class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="{{PAGE_BASE}}/" data-home aria-label="返回首页">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3 27 9.5v13L16 29 5 22.5v-13L16 3z"/>
          <path d="M11 13l-3 3 3 3M21 13l3 3-3 3M18 12l-4 8"/>
        </svg>
      </span>
      <span class="logo-text"><b id="brandName">赛博博客</b><small id="brandSub">SHAIBOBLOG</small></span>
    </a>

    <nav class="main-nav" aria-label="主导航">
      <a href="{{PAGE_BASE}}/" data-home class="active">首页</a>
      <a href="javascript:;" data-home-anchor="articleList">文章</a>
      <a href="javascript:;" data-home-anchor="catPanel">分类</a>
      <a href="javascript:;" data-home-anchor="tagPanel">标签</a>
      <a href="javascript:;" data-home-anchor="aboutPanel">关于</a>

    <form class="topbar-search" id="topbarSearchForm" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input type="search" id="searchInput" placeholder="搜索文章…" autocomplete="off" aria-label="搜索文章">
    </form>

    <div class="topbar-right">
      <a class="btn-write" href="{{PAGE_BASE}}/write">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        写文章
      </a>
      <a class="btn-login" id="loginBtn" href="{{PAGE_BASE}}/login">登录</a>
      <button class="topbar-avatar" id="topbarAvatar" type="button" aria-label="我的主页"></button>
    </div>
  </div>
