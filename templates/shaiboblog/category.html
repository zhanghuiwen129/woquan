<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<meta name="keywords" content="{{PAGE_KEYWORDS}}">
<title>{{PAGE_TITLE}}</title>
<link rel="stylesheet" href="assets/css/style.css?v=20261128.03">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<script>
window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/';
window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
</script>
</head>
<body class="page-category">
<h1 class="sr-only">文章分类</h1>

<!-- @include partials/topbar.html -->

<main class="page-main">
  <section class="page-head">
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="{{PAGE_BASE}}/" data-home>首页</a><span>/</span>
      <a href="javascript:;" id="chanCrumb">分类</a>
    </nav>
    <div class="page-head-main">
      <div class="page-head-copy">
        <span class="page-kicker">// CATEGORY</span>
        <h1 id="chanName">文章分类</h1>
        <p id="chanDesc">聚合该分类下的全部文章</p>
        <div class="page-head-meta" id="chanStats">—</div>
      </div>
      <div class="page-head-actions">
        <button class="btn-ghost" id="chanFollow" type="button">关注分类</button>
      </div>
    </div>
  </section>

  <div class="blog-layout">
    <aside class="side side-left">
      <!-- @include partials/side-left.html -->
    </aside>

    <section class="content-col">
      <div class="filter-bar">
        <div class="sub-chips" id="subChips"></div>
        <div class="sort-group" id="sortGroup">
          <button class="sort active" data-sort="latest" type="button">最新</button>
          <button class="sort" data-sort="hot" type="button">热门</button>
          <button class="sort" data-sort="comment" type="button">评论</button>
        </div>
      </div>
      <section class="post-list" id="feed">{{SSR_FEED}}</section>
      <div class="load-more" id="load-more">上滑加载更多</div>
    </section>

    <aside class="side side-right">
      <!-- @include partials/side-right.html -->
    </aside>
  </div>
</main>

<!-- @include partials/footer.html -->

<!-- @include partials/tabbar.html -->

<!-- @include partials/page-tail.html -->

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
