<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <meta name="keywords" content="{{PAGE_KEYWORDS}}">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script>
        window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/';
        window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
    </script>
</head>
<body class="page-topic">
    <h1 class="sr-only">话题详情</h1>

<header class="topbar plainbar">
    <div class="topbar-inner">
        <button class="back-btn" id="backBtn" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="topbar-title">话题详情</span>
        <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="text" id="searchInput" placeholder="搜索话题">
        </label>
    </div>
</header>

<div class="wrap">
    <main>
        <section class="topic-hero" id="topicHero">
            <img id="topicCover" alt="话题头图">
            <div class="topic-mask"></div>
            <div class="topic-info">
                <div class="topic-name" id="topicName"># 话题</div>
                <div class="topic-brief" id="topicBrief">汇集该话题下的全部资讯与讨论。</div>
                <div class="topic-stats" id="topicStats"></div>
                <div class="topic-actions">
                    <button class="btn-primary" id="joinBtn">参与讨论</button>
                    <button class="btn-ghost-light" id="favTopicBtn">收藏话题</button>
                </div>
            </div>
        </section>

        <button class="topic-compose" id="topicCompose" type="button">
            <span class="topic-compose-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </span>
            <span class="topic-compose-text" id="topicComposeText">参与话题讨论，分享你的看法…</span>
            <span class="topic-compose-go">发布</span>
        </button>

        <div class="sort-bar" id="sortBar">
            <button class="sort active" data-sort="latest">最新</button>
            <button class="sort" data-sort="hot">最热</button>
        </div>

        <section class="feed" id="topicFeed">{{SSR_FEED}}</section>
        <div class="load-more" id="load-more">上滑加载更多</div>
    </main>

    <aside class="aside">
        <section class="panel">
            <div class="panel-title">相关话题</div>
            <div class="topic-list" id="topicList">{{SSR_SIDE}}</div>
        </section>
        <section class="panel">
            <div class="panel-title">话题活跃作者</div>
            <div id="asideAuthors"></div>
        </section>
    </aside>
</div>

<!-- @include partials/tabbar.html -->

<!-- @include partials/page-tail.html -->

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
