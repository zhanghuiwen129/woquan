<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <meta name="keywords" content="{{PAGE_KEYWORDS}}">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script>
        window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/';
        window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
    </script>
</head>
<body class="page-messages">
    <h1 class="sr-only">消息中心</h1>

<!-- 消息页顶栏含「全部已读」专属操作，保留页面内联，不套用公共 topbar -->
<header class="topbar">
    <div class="topbar-inner">
        <a class="logo" href="/" data-home>
            <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 20C8 14 12 10 20 5"/><circle cx="6" cy="18" r="1.6" fill="#fff" stroke="none"/></svg></span>
            <span id="brandName">woquan</span>
        </a>
        <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="text" id="searchInput" placeholder="搜索资讯、话题、作者">
        </label>
        <div class="topbar-right">
            <button class="topbar-link" id="readAllBtn">全部已读</button>
        </div>
    </div>
</header>

<div class="wrap">
    <nav class="tabs" id="noticeTabs">
        <button class="tab active" data-tab="comment">评论<span class="badge" id="badge-comment" style="display:none">0</span></button>
        <button class="tab" data-tab="like">点赞<span class="badge" id="badge-like" style="display:none">0</span></button>
        <button class="tab" data-tab="follow">关注<span class="badge" id="badge-follow" style="display:none">0</span></button>
        <button class="tab" data-tab="channel">频道<span class="badge" id="badge-channel" style="display:none">0</span></button>
        <button class="tab" data-tab="system">系统<span class="badge" id="badge-system" style="display:none">0</span></button>
    </nav>
    <div id="noticeList"></div>
    <div class="load-more" id="load-more" style="display:none">加载更多</div>
</div>

<!-- @include partials/tabbar.html -->

<!-- @include partials/page-tail.html -->

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
