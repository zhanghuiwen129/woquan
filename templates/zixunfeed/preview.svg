<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <!-- background -->
  <rect width="800" height="600" fill="#F3F5F4"/>

  <!-- topbar -->
  <rect x="0" y="0" width="800" height="58" fill="#0E7C6B"/>
  <rect x="24" y="18" width="26" height="22" rx="6" fill="#0E7C6B" stroke="#fff" stroke-width="2"/>
  <text x="60" y="36" fill="#fff" font-size="18" font-weight="700">资讯圈</text>
  <rect x="300" y="14" width="300" height="30" rx="15" fill="#fff" opacity="0.18"/>
  <text x="320" y="34" fill="#E3F1EE" font-size="13">搜索资讯、话题、作者</text>
  <rect x="690" y="16" width="76" height="26" rx="13" fill="#fff"/>
  <text x="710" y="34" fill="#0E7C6B" font-size="13" font-weight="700">登录</text>

  <!-- channel tabs -->
  <rect x="0" y="58" width="800" height="40" fill="#fff"/>
  <g font-size="14" fill="#66726E">
    <text x="28" y="83" fill="#17211E" font-weight="700">推荐</text>
    <text x="92" y="83">热点</text>
    <text x="148" y="83">野钓</text>
    <text x="200" y="83">路亚</text>
    <text x="252" y="83">台钓</text>
    <text x="304" y="83">装备</text>
    <text x="356" y="83">视频</text>
  </g>
  <rect x="28" y="96" width="28" height="3" rx="1.5" fill="#0E7C6B"/>

  <!-- main column -->
  <!-- hero -->
  <rect x="24" y="116" width="486" height="118" rx="12" fill="#0E7C6B"/>
  <rect x="44" y="138" width="120" height="74" rx="8" fill="#E3F1EE"/>
  <text x="180" y="150" fill="#fff" font-size="15" font-weight="700">今日头条 · 头条精选</text>
  <text x="180" y="176" fill="#E3F1EE" font-size="12">沉浸式资讯，看见更大的世界</text>
  <rect x="44" y="216" width="44" height="6" rx="3" fill="#E8833A"/>

  <!-- flash -->
  <rect x="24" y="244" width="486" height="34" rx="8" fill="#FBEFE6"/>
  <text x="38" y="266" fill="#E8833A" font-size="12" font-weight="700">快讯</text>
  <text x="86" y="266" fill="#66726E" font-size="12">行业新规发布，钓鱼爱好者迎来利好……</text>

  <!-- cards -->
  <g>
    <!-- card 1 big thumb -->
    <rect x="24" y="290" width="486" height="92" rx="12" fill="#fff" stroke="#E6EAE8"/>
    <rect x="402" y="302" width="92" height="68" rx="8" fill="#E3F1EE"/>
    <text x="40" y="318" fill="#17211E" font-size="14" font-weight="700">野钓实战：水库大物的遛鱼技巧全解析</text>
    <text x="40" y="340" fill="#66726E" font-size="11">钓手老王 · 2.3万阅读</text>
    <text x="40" y="366" fill="#0E7C6B" font-size="11">♥ 1.2k  💬 186  ☆ 收藏</text>

    <!-- card 2 text -->
    <rect x="24" y="392" width="486" height="74" rx="12" fill="#fff" stroke="#E6EAE8"/>
    <text x="40" y="418" fill="#17211E" font-size="14" font-weight="700">台钓调漂入门：从零理解灵与钝的平衡</text>
    <text x="40" y="442" fill="#66726E" font-size="11">垂钓学院 · 9856阅读</text>
    <text x="40" y="462" fill="#0E7C6B" font-size="11">♥ 642  💬 73</text>

    <!-- card 3 grid3 -->
    <rect x="24" y="478" width="486" height="96" rx="12" fill="#fff" stroke="#E6EAE8"/>
    <rect x="40" y="492" width="140" height="62" rx="8" fill="#E3F1EE"/>
    <rect x="190" y="492" width="140" height="62" rx="8" fill="#E3F1EE"/>
    <rect x="340" y="492" width="140" height="62" rx="8" fill="#E3F1EE"/>
    <text x="40" y="570" fill="#17211E" font-size="13" font-weight="700">十大经典路亚假饵使用场景图解</text>
  </g>

  <!-- sidebar -->
  <g>
    <rect x="528" y="116" width="248" height="150" rx="12" fill="#fff" stroke="#E6EAE8"/>
    <text x="544" y="142" fill="#17211E" font-size="14" font-weight="700">热榜</text>
    <g fill="#66726E" font-size="12">
      <text x="544" y="170" fill="#E8833A" font-weight="700">1</text><text x="566" y="170">春季野钓装备清单</text>
      <text x="544" y="196" fill="#E8833A" font-weight="700">2</text><text x="566" y="196">新手调漂常见误区</text>
      <text x="544" y="222" fill="#E8833A" font-weight="700">3</text><text x="566" y="222">路亚标点选择</text>
    </g>

    <rect x="528" y="282" width="248" height="120" rx="12" fill="#fff" stroke="#E6EAE8"/>
    <text x="544" y="308" fill="#17211E" font-size="14" font-weight="700">热门话题</text>
    <g>
      <rect x="544" y="322" width="64" height="24" rx="12" fill="#E3F1EE"/>
      <text x="558" y="338" fill="#0E7C6B" font-size="11">#野钓</text>
      <rect x="616" y="322" width="64" height="24" rx="12" fill="#E3F1EE"/>
      <text x="630" y="338" fill="#0E7C6B" font-size="11">#路亚</text>
      <rect x="544" y="354" width="64" height="24" rx="12" fill="#E3F1EE"/>
      <text x="558" y="370" fill="#0E7C6B" font-size="11">#台钓</text>
    </g>

    <rect x="528" y="418" width="248" height="120" rx="12" fill="#fff" stroke="#E6EAE8"/>
    <text x="544" y="444" fill="#17211E" font-size="14" font-weight="700">关注作者</text>
    <g>
      <circle cx="560" cy="478" r="14" fill="#0E7C6B"/>
      <text x="582" y="483" fill="#17211E" font-size="12">钓手老王</text>
      <circle cx="560" cy="512" r="14" fill="#0E7C6B"/>
      <text x="582" y="517" fill="#17211E" font-size="12">垂钓学院</text>
    </g>
  </g>

  <!-- mobile tabbar -->
  <rect x="0" y="566" width="800" height="34" fill="#fff" stroke="#E6EAE8"/>
  <g fill="#66726E" font-size="11" text-anchor="middle">
    <text x="120" y="585" fill="#0E7C6B" font-weight="700">首页</text>
    <text x="280" y="585">视频</text>
    <circle cx="400" cy="579" r="13" fill="#0E7C6B"/>
    <text x="520" y="585">消息</text>
    <text x="680" y="585">我的</text>
  </g>
</svg>
