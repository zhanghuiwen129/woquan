<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <meta name="keywords" content="{{PAGE_KEYWORDS}}">
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script>
        window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/';
        window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
    </script>
</head>
<body class="page-login">
    <h1 class="sr-only">登录注册</h1>

<div class="page">
    <section class="brand-side">
        <img src="assets/images/login-cover.svg?v=20261115.1" alt="社区封面">
        <div class="brand-mask"></div>
        <div class="brand-content">
            <div class="brand-logo">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round"><path d="M4 20C8 14 12 10 20 5"/><circle cx="6" cy="18" r="1.6" fill="#0E7C6B" stroke="none"/></svg></span>
                <span id="brandNameLeft">woquan</span>
            </div>
            <div class="brand-slogan">
                <h2>记录每一次分享，<br>和同好一起交流</h2>
                <p>资讯、攻略、实拍与经验，属于每一个热爱记录的人的内容社区。</p>
                <div class="brand-points" id="brandPoints">
                    <span><b>—</b>篇内容</span><span><b>—</b>位作者</span><span><b>—</b>条讨论</span>
                </div>
            </div>
        </div>
    </section>

    <section class="form-side" id="loginRoot">
        <div class="form-card">
            <div class="form-logo">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 20C8 14 12 10 20 5"/><circle cx="6" cy="18" r="1.6" fill="#fff" stroke="none"/></svg></span>
                <span id="brandNameRight">woquan</span>
            </div>
            <div class="form-sub" id="formSub">登录后查看收藏、消息与你的创作</div>

            <div class="method" id="method">
                <button class="method-btn active" data-method="code">验证码登录</button>
                <button class="method-btn" data-method="pwd">密码登录</button>
            </div>

            <form id="loginForm" onsubmit="return false">
                <div class="field">
                    <label id="accountLabel">手机号</label>
                    <div class="field-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
                        <input type="text" id="account" placeholder="请输入手机号" autocomplete="username">
                    </div>
                </div>

                <div class="field" id="codeField">
                    <label>验证码</label>
                    <div class="field-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input type="text" id="code" placeholder="6 位验证码" maxlength="6">
                        <button type="button" class="code-btn" id="codeBtn">获取验证码</button>
                    </div>
                </div>

                <div class="field" id="pwdField" style="display:none">
                    <label>密码</label>
                    <div class="field-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password">
                    </div>
                </div>

                <div class="field" id="confirmField" style="display:none">
                    <label>确认密码</label>
                    <div class="field-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input type="password" id="pwdConfirm" placeholder="再次输入密码" autocomplete="new-password">
                    </div>
                </div>

                <div class="field" id="emailField" style="display:none">
                    <label>邮箱（用于找回密码）</label>
                    <div class="field-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                        <input type="email" id="email" placeholder="请输入邮箱" autocomplete="email">
                    </div>
                </div>

                <div class="row">
                    <label class="agree"><input type="checkbox" id="agree"> 我已阅读并同意 <a href="javascript:;" data-agree="用户协议">《用户协议》</a> 和 <a href="javascript:;" data-agree="隐私政策">《隐私政策》</a></label>
                </div>

                <button type="submit" class="btn-main" id="submitBtn">登录</button>
            </form>

            <div class="hint" id="formHint"></div>

            <div class="divider">其他登录方式</div>
            <div class="third">
                <button class="third-btn" data-third="微信登录"><svg viewBox="0 0 24 24" fill="#2E86AB"><path d="M8.7 4C4.9 4 2 6.6 2 9.9c0 1.9 1 3.5 2.6 4.7l-.7 2.1 2.4-1.2c.8.2 1.5.3 2.4.3h.4a5.4 5.4 0 0 1-.2-1.5c0-3 2.9-5.3 6.3-5.3h.3C14.9 5.9 12.1 4 8.7 4zM6.6 8.6a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm4.3 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zM22 14.3c0-2.7-2.5-4.9-5.6-4.9s-5.6 2.2-5.6 4.9 2.5 4.9 5.6 4.9c.7 0 1.4-.1 2-.3l1.9 1-.5-1.7A4.7 4.7 0 0 0 22 14.3zm-7.5-.7a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zm3.8 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6z"/></svg></button>
                <button class="third-btn" data-third="QQ 登录"><svg viewBox="0 0 24 24" fill="#4A6FA5"><path d="M12 2C8.7 2 6 4.7 6 8c0 .6.1 1.2.3 1.7C5 10.8 4 12.6 4 14.6c0 .5.1 1 .3 1.4l-.9 2.6 2.6-1.3c1.2.7 2.6 1.1 4 1.1s2.8-.4 4-1.1l2.6 1.3-.9-2.6c.2-.4.3-.9.3-1.4 0-2-1-3.8-2.3-4.9.2-.5.3-1.1.3-1.7 0-3.3-2.7-6-6-6z"/></svg></button>
                <button class="third-btn" data-third="微博登录"><svg viewBox="0 0 24 24" fill="#E8833A"><path d="M10.1 20.5c-3.6.4-6.7-1.3-7-3.8-.3-2.5 2.5-4.8 6.1-5.2 3.6-.4 6.7 1.3 7 3.8.3 2.5-2.5 4.8-6.1 5.2zm4.9-9.4c-.4-.1-.6-.2-.4-.7.4-1.1.4-2.1 0-2.8-.7-1.2-2.7-1.2-4.9-.1 0 0-.7.3-.5-.3.3-1 .2-1.9-.3-2.4-1.2-1.2-4.4.1-7.1 3.1C.8 10.1.2 11.6.2 13c0 2.7 3.5 4.4 6.9 4.4 4.5 0 7.5-2.6 7.5-4.7 0-1.3-1.1-2-1.6-2.2zM19.4 6.1A4.6 4.6 0 0 0 15 3.6c-.4 0-.8.3-.8.7 0 .4.3.7.7.8 1.2.1 2.2.7 2.9 1.7.2.4.7.5 1 .3.4-.1.5-.6.6-1zM21.6 10.2c-.4-.5-1-.8-1.5-.6-.4.1-.6.6-.5 1 .2.6.1 1.3-.2 1.8-.3.4-.2 1 .2 1.3.5.3 1.1.2 1.5-.3 1-1.3 1-2.9.5-3.2z"/></svg></button>
            </div>

            <div class="form-foot" id="formFoot">还没有账号？<a href="javascript:;" id="toggleReg">立即注册</a></div>
        </div>
    </section>
</div>

<!-- @include partials/page-tail.html -->

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
