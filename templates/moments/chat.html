<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="私信 - {{SITE_NAME}}">
    <title>私信 - {{SITE_NAME}}</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20261117.1">
    <script>
        window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/'; window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
    </script>
</head>
<body data-page="chat">
<div class="app-container">
    <!-- PC 端左中右三栏布局容器 -->
    <div class="pc-layout">

        <!-- 左栏 (仅 PC 端显示) -->
        <aside class="sidebar-left">
            <div class="sidebar-card user-card">
                <div class="user-card-avatar">
                    <img src="assets/images/default-avatar.svg" alt="avatar" id="sidebar-avatar">
                </div>
                <div class="user-card-info">
                    <h3 id="sidebar-nickname">woquan 用户</h3>
                    <p class="user-bio" id="sidebar-bio">这个人很懒，什么都没留下~</p>
                </div>
                <div class="user-card-stats" id="sidebar-stats">
                    <div class="stat-item">
                        <span class="stat-num" id="sidebar-stat-posts">0</span>
                        <span class="stat-label">动态</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="sidebar-stat-following">0</span>
                        <span class="stat-label">关注</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="sidebar-stat-followers">0</span>
                        <span class="stat-label">粉丝</span>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" onclick="if(app.checkAuth() && app.user) app.goUser(app.user.username); else app.openAuthModal();">查看主页</button>
            </div>

            <div class="sidebar-card nav-card">
                <h4 class="sidebar-title">功能菜单</h4>
                <ul class="nav-list">
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); location.assign(window.HUBLOG_PAGE_BASE + '/');"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>首页</span></a></li>
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); location.assign(window.HUBLOG_PAGE_BASE + '/search');"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>发现</span></a></li>
                    <li><a href="#" class="nav-link active" onclick="event.preventDefault();"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>私信</span><span class="chat-nav-badge" id="chat-unread-badge" style="display:none;">0</span></a></li>
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); if(app.checkAuth()) { location.assign(window.HUBLOG_PAGE_BASE + '/favorites'); } else { app.openAuthModal(); }"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>我的收藏</span></a></li>
                </ul>
            </div>
        </aside>

        <!-- 中栏主内容 -->
        <main class="main-content">
            <div class="chat-container">
                <!-- 会话列表视图 -->
                <div class="chat-list-view" id="chat-list-view">
                    <div class="chat-header">
                        <h2>私信</h2>
                        <div class="actions">
                            <button class="btn-icon" id="btn-new-chat" title="发起新会话">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="chat-conversation-list" id="chat-conversation-list">
                        <div class="chat-loading">加载中...</div>
                    </div>
                </div>

                <!-- 聊天详情视图（显示/隐藏交给 CSS 按 data-active 属性控制，勿加内联 style="display"，否则覆盖 @media 规则） -->
                <div class="chat-detail-view" id="chat-detail-view" data-active="0">
                    <div class="chat-detail-header">
                        <button class="chat-back-btn" id="chat-back-btn" aria-label="返回">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <span class="chat-detail-title" id="chat-detail-title">聊天</span>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-empty">选择一个会话开始聊天</div>
                    </div>
                    <div class="chat-media-options" id="chat-media-options" style="display:none;">
                        <div class="chat-media-grid">
                            <div class="chat-media-item" data-action="image">
                                <div class="chat-media-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                                </div>
                                <span class="chat-media-label">图片</span>
                            </div>
                            <div class="chat-media-item" data-action="video">
                                <div class="chat-media-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                                </div>
                                <span class="chat-media-label">视频</span>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-bar">
                        <button class="chat-emoji-btn" id="chat-emoji-btn" aria-label="表情">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </button>
                        <button class="chat-add-btn" id="chat-add-btn" aria-label="更多">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                        <textarea id="chat-input" class="chat-input" placeholder="输入消息..." rows="1"></textarea>
                        <button class="chat-send-btn" id="chat-send-btn" aria-label="发送">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                    <input type="file" id="chat-image-input" accept="image/*" style="display:none;">
                    <input type="file" id="chat-video-input" accept="video/*" style="display:none;">
                </div>
            </div>
        </main>

        <!-- 右栏 (仅 PC 端显示) -->
        <aside class="sidebar-right">
            <div class="sidebar-card stats-card">
                <h4 class="sidebar-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>动态统计</h4>
                <div class="stats-grid">
                    <div class="stats-item">
                        <div class="stats-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
                        <div class="stats-info">
                            <div class="stats-value" id="stats-total-posts">0</div>
                            <div class="stats-label">全部动态</div>
                        </div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                        <div class="stats-info">
                            <div class="stats-value" id="stats-total-comments">0</div>
                            <div class="stats-label">评论总数</div>
                        </div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
                        <div class="stats-info">
                            <div class="stats-value" id="stats-total-likes">0</div>
                            <div class="stats-label">点赞总数</div>
                        </div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                        <div class="stats-info">
                            <div class="stats-value" id="stats-total-users">0</div>
                            <div class="stats-label">注册用户</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-card user-ranking" id="user-ranking-card" style="display:none;">
                <h3 class="sidebar-card-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>用户排行</h3>
                <div id="user-ranking-list" class="ranking-list"></div>
            </div>

            <div class="sidebar-card friends-card">
                <h4 class="sidebar-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>友情链接</h4>
                <ul class="friends-list" id="sidebar-friends">
                    <li>加载中...</li>
                </ul>
            </div>

            <div class="sidebar-card info-card">
                <h4 class="sidebar-title"><svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>关于</h4>
                <p class="info-text">woquan 是一个轻量级的社交系统，致力于为用户提供简洁、高效的沟通平台。</p>
                <div class="info-links">
                    <a href="#" onclick="event.preventDefault(); app.showToast('功能开发中');">了解更多</a>
                    <span>·</span>
                    <a href="#" onclick="event.preventDefault(); app.showToast('功能开发中');">帮助中心</a>
                    <span>·</span>
                    <a href="#" onclick="event.preventDefault(); app.showToast('功能开发中');">反馈建议</a>
                </div>
            </div>
        </aside>

    </div>
    <!-- 结束 pc-layout -->

    <!-- 底部导航 -->
    <div class="bottom-nav" id="bottom-nav"></div>

    <!-- 图片查看器 -->
    <div class="image-viewer" id="image-viewer">
        <button class="close-viewer" id="close-viewer" aria-label="关闭">&times;</button>
        <img src="" id="viewer-img" alt="" onclick="event.stopPropagation()">
        <button class="viewer-nav" id="viewer-prev" aria-label="上一张">&#10094;</button>
        <button class="viewer-nav viewer-nav-next" id="viewer-next" aria-label="下一张">&#10095;</button>
    </div>
</div>

<script type="module" src="assets/js/app.js?v=20261117.3"></script>
</body>
</html>
