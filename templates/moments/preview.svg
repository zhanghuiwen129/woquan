<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="经典朋友圈主题预览">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#ededed"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07c160"/>
      <stop offset="1" stop-color="#06ad56"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- 顶部导航 -->
  <rect x="0" y="0" width="480" height="46" fill="#fff"/>
  <rect x="20" y="17" width="86" height="12" rx="6" fill="#333"/>
  <circle cx="446" cy="23" r="9" fill="#e5e5e5"/>
  <circle cx="422" cy="23" r="9" fill="#e5e5e5"/>
  <!-- 封面图 -->
  <rect x="0" y="46" width="480" height="86" fill="url(#cover)"/>
  <circle cx="56" cy="132" r="30" fill="#fff" stroke="#ededed" stroke-width="4"/>
  <circle cx="56" cy="126" r="11" fill="#c8e6d4"/>
  <path d="M38 150 a18 15 0 0 1 36 0" fill="#c8e6d4"/>
  <rect x="98" y="110" width="112" height="11" rx="5" fill="#fff"/>
  <rect x="98" y="128" width="70" height="8" rx="4" fill="rgba(255,255,255,.75)"/>
  <!-- 信息流卡片 1 -->
  <rect x="0" y="166" width="480" height="70" fill="#fff"/>
  <circle cx="30" cy="191" r="13" fill="#d7d7d7"/>
  <rect x="52" y="181" width="78" height="9" rx="4" fill="#576b95"/>
  <rect x="52" y="197" width="300" height="8" rx="4" fill="#bbb"/>
  <rect x="52" y="211" width="220" height="8" rx="4" fill="#ccc"/>
  <!-- 信息流卡片 2 -->
  <rect x="0" y="240" width="480" height="60" fill="#fff"/>
  <circle cx="30" cy="262" r="13" fill="#d7d7d7"/>
  <rect x="52" y="254" width="64" height="9" rx="4" fill="#576b95"/>
  <rect x="52" y="270" width="260" height="8" rx="4" fill="#bbb"/>
  <rect x="52" y="284" width="176" height="8" rx="4" fill="#ccc"/>
  <line x1="0" y1="165" x2="480" y2="165" stroke="#ededed" stroke-width="1"/>
  <line x1="0" y1="239" x2="480" y2="239" stroke="#ededed" stroke-width="1"/>
  <!-- 角标 -->
  <rect x="384" y="8" width="80" height="22" rx="11" fill="rgba(7,193,96,.14)"/>
  <text x="424" y="23" font-family="-apple-system,Segoe UI,sans-serif" font-size="11" fill="#07c160" text-anchor="middle">当前主题</text>
</svg>
