<script>
(async () => {
    await app.init();
    const list = document.getElementById('moments-list');
    list.innerHTML = '';
    try {
        const data = await app.request('/posts/pinned');
        if (!data || data.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="icon">📌</div><div>暂无置顶动态</div></div>';
        } else {
            data.forEach(post => list.appendChild(app.createPostElement(post)));
        }
    } catch (e) {
        list.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div>加载失败：' + app.escapeHtml(e.message) + '</div></div>';
    }
})();
</script>
