<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>粉丝列表 - {{SITE_NAME}}</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20261117.1">
    <script>
        window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/'; window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
    </script>
</head>
<body data-page="followers">
<div class="app-container">
    <!-- PC 端左中右三栏布局容器 -->
    <div class="pc-layout">

        <!-- 左栏 (仅 PC 端显示) -->
        <aside class="sidebar-left">
            <div class="sidebar-card user-card">
                <div class="user-card-avatar">
                    <img src="assets/images/default-avatar.svg" alt="avatar" id="sidebar-avatar">
                </div>
                <div class="user-card-info">
                    <h3 id="sidebar-nickname">woquan 用户</h3>
                    <p class="user-bio" id="sidebar-bio">这个人很懒，什么都没留下~</p>
                </div>
                <div class="user-card-stats" id="sidebar-stats">
                    <div class="stat-item"><span class="stat-num" id="sidebar-stat-posts">0</span><span class="stat-label">动态</span></div>
                    <div class="stat-item"><span class="stat-num" id="sidebar-stat-following">0</span><span class="stat-label">关注</span></div>
                    <div class="stat-item"><span class="stat-num" id="sidebar-stat-followers">0</span><span class="stat-label">粉丝</span></div>
                </div>
                <button class="btn btn-primary btn-block" onclick="if(app.checkAuth() && app.user) app.goUser(app.user.username); else app.openAuthModal();">查看主页</button>
            </div>
            <div class="sidebar-card nav-card">
                <h4 class="sidebar-title">功能菜单</h4>
                <ul class="nav-list">
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); location.assign(window.HUBLOG_PAGE_BASE + '/');"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>首页</span></a></li>
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); location.assign(window.HUBLOG_PAGE_BASE + '/search');"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>发现</span></a></li>
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); if(app.checkAuth()) { location.assign(window.HUBLOG_PAGE_BASE + '/messages'); } else { app.openAuthModal(); }"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>消息中心</span></a></li>
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); if(app.checkAuth()) { location.assign(window.HUBLOG_PAGE_BASE + '/chat'); } else { app.openAuthModal(); }"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>私信</span></a></li>
                    <li><a href="#" class="nav-link" onclick="event.preventDefault(); if(app.checkAuth()) { location.assign(window.HUBLOG_PAGE_BASE + '/favorites'); } else { app.openAuthModal(); }"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>我的收藏</span></a></li>
                </ul>
            </div>
        </aside>

        <!-- 中栏主内容 -->
        <main class="main-content">
            <!-- 页头 (移动端显示) -->
            <div class="follow-list-header navbar" id="follow-list-header">
                <button class="btn-icon-back" onclick="history.back()" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="title" id="follow-list-title">粉丝</div>
                <div class="actions"></div>
            </div>

            <!-- 用户信息条（查看他人粉丝/关注时显示） -->
            <div class="follow-list-subject" id="follow-list-subject" style="display:none;padding:12px 16px;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--card-bg);">
                <img id="fl-subject-avatar" src="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" onerror="this.src='assets/images/default-avatar.svg'">
                <div style="flex:1;min-width:0;">
                    <div id="fl-subject-name" style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">用户</div>
                    <div id="fl-subject-type" style="font-size:12px;color:var(--text-secondary);">的粉丝</div>
                </div>
            </div>

            <div class="user-search-list" id="follow-list-container" style="padding:0;">
                <div class="empty-state">加载中...</div>
            </div>

            <div class="msg-load-more" id="follow-list-more" style="display:none;">加载更多</div>
            <div style="height: 24px;"></div>
        </main>

        <!-- 右栏 (仅 PC 端显示) -->
        <aside class="sidebar-right">
            <div class="sidebar-card">
                <h4 class="sidebar-title">站点信息</h4>
                <div id="sidebar-friend-links"></div>
            </div>
        </aside>
    </div>
    <!-- 结束 pc-layout -->

    <!-- 底部导航 -->
    <div class="bottom-nav" id="bottom-nav"></div>
</div>

<script type="module" src="assets/js/app.js?v=20261117.1"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    if (typeof window.app === 'undefined') return;
    // 判断 URL：/u/{username}/followers 或 /followers（当前登录用户）
    const pathMatch = window.location.pathname.match(/\/u\/([^/]+)\/followers/);
    const username = pathMatch ? pathMatch[1] : (window.app.user ? window.app.user.username : '');
    window.app._followListType = 'followers';
    window.app._followListUsername = username;
    window.app._followListPage = 1;
    window.app._followListHasMore = true;
    await window.app.initFollowListPage();
});
</script>
</body>
</html>
