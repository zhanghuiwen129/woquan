<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码重置 - {{SITE_NAME}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reset-card { background: #fff; border-radius: 12px; padding: 40px; max-width: 420px; width: 90%; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
        .reset-card h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
        .reset-card p.desc { color: #888; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #07c160; }
        .btn { width: 100%; padding: 14px; background: #07c160; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .alert.error { background: #fef0f0; color: #f56c6c; }
        .alert.success { background: #f0f9eb; color: #67c23a; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #07c160; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h1>重置密码</h1>
        <p class="desc">请输入您的新密码</p>
        <div class="alert" id="alert"></div>
        <form id="resetForm">
            <input type="hidden" id="token" value="">
            <input type="hidden" id="email" value="">
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="password" placeholder="至少8位，含大小写字母和数字" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="password_confirm" placeholder="再次输入新密码" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">重置密码</button>
        </form>
        <a href="/" class="back-link">返回首页</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('token').value = params.get('token') || '';
        document.getElementById('email').value = params.get('email') || '';
        const baseUrl = window.HUBLOG_BASE_URL || '/';

        function showAlert(msg, type) {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = 'alert ' + type;
            alert.style.display = 'block';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '重置中...';

            const data = {
                email: document.getElementById('email').value,
                token: document.getElementById('token').value,
                password: document.getElementById('password').value,
                password_confirm: document.getElementById('password_confirm').value
            };

            try {
                const csrfRes = await fetch(baseUrl + '/api/index.php/csrf');
                const csrfData = await csrfRes.json();
                const csrfToken = csrfData.data?.token || '';

                const res = await fetch(baseUrl + '/api/index.php/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrfToken },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.code === 200) {
                    showAlert('密码重置成功！正在跳转登录...', 'success');
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    showAlert(result.message || '重置失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '重置密码';
                }
            } catch (err) {
                showAlert('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        });
    </script>
</body>
</html>
