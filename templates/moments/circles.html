<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <meta name="keywords" content="{{PAGE_KEYWORDS}}">
    <link rel="stylesheet" href="assets/css/style.css?v=20261117.1">
    <script>
        window.HUBLOG_BASE_URL = window.HUBLOG_BASE_URL || '/'; window.HUBLOG_PAGE_BASE = window.HUBLOG_PAGE_BASE || '';
    </script>
    <style>
        /* 圈子列表页专属样式 */
        .circles-header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card-bg); }
        .circles-search { display: flex; gap: 8px; align-items: center; }
        .circles-search input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 14px; background: var(--bg); color: var(--text); }
        .circles-search button { padding: 8px 16px; border: none; background: var(--primary); color: #fff; border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .circles-create-btn { margin-top: 10px; padding: 8px 14px; border: 1px dashed var(--primary); background: transparent; color: var(--primary); border-radius: 6px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .circles-create-btn:hover { background: rgba(7,193,96,0.08); }
        .circles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
        .circle-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: box-shadow .2s, transform .2s; display: flex; flex-direction: column; }
        .circle-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .circle-cover { width: 100%; height: 120px; object-fit: cover; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; font-weight: 600; position: relative; }
        .circle-cover img { width: 100%; height: 100%; object-fit: cover; }
        .circle-flag { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px); }
        .circle-flag-private { background: rgba(220,38,38,0.85); }
        .circle-flag-protected { background: rgba(217,119,6,0.85); }
        .circle-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
        .circle-name { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 6px; cursor: pointer; }
        .circle-name:hover { color: var(--primary); }
        .circle-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 12px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .circle-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
        .circle-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .circle-actions { display: flex; gap: 8px; }
        .circle-btn { padding: 6px 14px; border: none; border-radius: 14px; font-size: 13px; cursor: pointer; flex: 1; }
        .circle-btn-primary { background: var(--primary); color: #fff; }
        .circle-btn-primary:hover { opacity: .9; }
        .circle-btn-default { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .circle-btn-default:hover { background: rgba(0,0,0,0.04); }
        .circle-btn-joined { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
        .circle-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .circle-empty .icon { font-size: 48px; margin-bottom: 12px; }
        .circle-load-more { text-align: center; padding: 16px; color: var(--text-secondary); font-size: 14px; }
        /* 创建圈子弹层 */
        .circle-form-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px; }
        .circle-form-overlay.active { display: flex; }
        .circle-form-modal { background: var(--card-bg); border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .circle-form-modal h3 { margin: 0 0 16px; font-size: 16px; }
        .circle-form-modal .form-group { margin-bottom: 14px; }
        .circle-form-modal label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        .circle-form-modal .form-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--bg); color: var(--text); box-sizing: border-box; }
        .circle-form-modal textarea.form-input { min-height: 80px; resize: vertical; }
        .circle-form-actions { display: flex; gap: 12px; margin-top: 8px; }
        @media (max-width: 640px) { .circles-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<script type="module" src="assets/js/app.js?v=20261117.1"></script>
<script>
let circlesPage = 1;
let circlesHasMore = true;
let circlesLoading = false;
let circlesKeyword = '';

async function loadCircles(reset) {
    if (circlesLoading) return;
    if (reset) { circlesPage = 1; circlesHasMore = true; document.getElementById('circles-grid').innerHTML = ''; }
    if (!circlesHasMore) return;
    circlesLoading = true;
    const loadMore = document.getElementById('circles-load-more');
    loadMore.style.display = 'block';
    loadMore.textContent = '加载中...';
    try {
        const params = new URLSearchParams({ page: circlesPage, limit: 20 });
        if (circlesKeyword) params.set('keyword', circlesKeyword);
        const data = await app.request('/circles?' + params.toString());
        const list = data.list || [];
        const pagination = data.pagination || {};
        circlesHasMore = (pagination.page || circlesPage) < (pagination.pages || 0);
        const grid = document.getElementById('circles-grid');
        if (list.length === 0 && circlesPage === 1) {
            grid.innerHTML = '<div class="circle-empty" style="grid-column:1/-1;"><div class="icon">🔍</div><div>暂无圈子，快来创建第一个吧~</div></div>';
        } else {
            list.forEach(c => grid.appendChild(renderCircleCard(c)));
        }
        circlesPage++;
        loadMore.textContent = circlesHasMore ? '滚动加载更多' : '没有更多了';
        if (!circlesHasMore) loadMore.style.display = 'none';
    } catch (e) {
        loadMore.textContent = '加载失败：' + (e.message || '未知错误');
    } finally {
        circlesLoading = false;
    }
}

function renderCircleCard(c) {
    const card = document.createElement('div');
    card.className = 'circle-card';
    const coverHtml = c.cover
        ? `<img src="${app.escapeHtml(c.cover)}" alt="" onerror="this.parentNode.textContent='${app.escapeHtml((c.name||'圈').slice(0,1))}'">`
        : app.escapeHtml((c.name || '圈').slice(0, 1) || '圈');
    // V50：可见性角标（非公开圈子显示锁图标）
    const visIcon = {
        protected: '<span class="circle-flag circle-flag-protected" title="受保护：内容仅成员可见">🔒</span>',
        private:   '<span class="circle-flag circle-flag-private" title="私密：仅成员可见">🔒</span>',
        public: ''
    };
    const visTag = visIcon[c.visibility] || '';
    // V50：加入按钮文案根据 join_mode 切换
    const joinMode = c.join_mode || 'free';
    let btnHtml = '';
    if (c.is_owner) {
        btnHtml = '<button class="circle-btn circle-btn-default" onclick="event.stopPropagation(); location.assign(window.HUBLOG_PAGE_BASE + \'/circle/' + c.id + '\')">管理</button>';
    } else if (c.is_member) {
        btnHtml = '<button class="circle-btn circle-btn-joined" data-action="leave" data-id="' + c.id + '">已加入</button>';
    } else if (joinMode === 'invite') {
        btnHtml = '<button class="circle-btn circle-btn-default" disabled title="仅邀请加入">仅邀请</button>';
    } else if (joinMode === 'approval') {
        btnHtml = '<button class="circle-btn circle-btn-primary" data-action="join" data-id="' + c.id + '" data-mode="approval">申请加入</button>';
    } else {
        btnHtml = '<button class="circle-btn circle-btn-primary" data-action="join" data-id="' + c.id + '" data-mode="free">加入</button>';
    }
    card.innerHTML = `
        <div class="circle-cover">${coverHtml}${visTag}</div>
        <div class="circle-body">
            <h3 class="circle-name" onclick="location.assign(window.HUBLOG_PAGE_BASE + '/circle/${c.id}')">${app.escapeHtml(c.name || '')}</h3>
            <p class="circle-desc">${app.escapeHtml(c.description || '暂无简介')}</p>
            <div class="circle-meta">
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${c.member_count || 0} 成员</span>
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>${c.post_count || 0} 动态</span>
            </div>
            <div class="circle-actions">
                <button class="circle-btn circle-btn-default" onclick="location.assign(window.HUBLOG_PAGE_BASE + '/circle/${c.id}')">查看</button>
                ${btnHtml}
            </div>
        </div>`;
    // 绑定加入/退出按钮
    const actionBtn = card.querySelector('[data-action]');
    if (actionBtn) actionBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!app.checkAuth()) { app.openAuthModal(); return; }
        const action = actionBtn.dataset.action;
        const id = actionBtn.dataset.id;
        try {
            if (action === 'join') {
                const mode = actionBtn.dataset.mode || 'free';
                await app.request('/circles/join?id=' + id, { method: 'POST' });
                showToast(mode === 'approval' ? '申请已提交，等待审核' : '已加入圈子');
            } else {
                if (!confirm('确定退出该圈子？')) return;
                await app.request('/circles/leave?id=' + id, { method: 'POST' });
                showToast('已退出圈子');
            }
            loadCircles(true);
        } catch (err) { showToast(err.message); }
    });
    return card;
}

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2000); }

function openCircleForm() {
    if (!app.checkAuth()) { app.openAuthModal(); return; }
    document.getElementById('circle-form-overlay').classList.add('active');
    document.getElementById('circle-name-input').focus();
}
function closeCircleForm() {
    document.getElementById('circle-form-overlay').classList.remove('active');
    document.getElementById('circle-name-input').value = '';
    document.getElementById('circle-desc-input').value = '';
    document.getElementById('circle-cover-input').value = '';
}
async function submitCircleForm() {
    const name = document.getElementById('circle-name-input').value.trim();
    const description = document.getElementById('circle-desc-input').value.trim();
    const cover = document.getElementById('circle-cover-input').value.trim();
    if (!name) { showToast('请填写圈子名称'); return; }
    // V135：与后端同口径（名称 7 字 / 简介 30 字），前端先拦，别等 400
    if ([...name].length > 7) { showToast('圈子名称最多 7 字'); return; }
    if ([...description].length > 30) { showToast('简介最多 30 字'); return; }
    try {
        await app.request('/circles', { method: 'POST', body: { name, description, cover } });
        showToast('创建成功');
        closeCircleForm();
        loadCircles(true);
    } catch (e) { showToast(e.message); }
}

// app.js 为 type="module"（延迟执行）：内联脚本解析即执行时 window.app 还不存在，
// 直接调用 app.init() 会抛 ReferenceError 导致整页数据不加载。
// 必须等 DOMContentLoaded（此时模块已执行、app.js 自身会调用 init()），
// 这里只补齐本页依赖的用户态（与 user.html 同一套模式）。
document.addEventListener('DOMContentLoaded', async () => {
    await app.fetchCsrf();
    await app.fetchUser();
    await app.loadSiteConfig();
    if (app.checkAuth()) {
        document.getElementById('circles-create-btn').style.display = 'inline-flex';
    }
    document.getElementById('circles-search-btn').addEventListener('click', () => {
        circlesKeyword = document.getElementById('circles-search-input').value.trim();
        loadCircles(true);
    });
    loadCircles(true);
    // 滚动加载
    window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) loadCircles(false);
    });
});
</script>
</body>
</html>
